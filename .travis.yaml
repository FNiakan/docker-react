sudo: required
services:
  - docker

before_install:
  - docker build -t fniakan/docker-react -f Dockerfile.dev .


script:
  - docker run -e CI=true fniakan/docker-react npm test

deploy:
  provider: elasticbeanstalk
  region: "us-east-1"
  app: "frontend"
  env: "Frontend-env"
  bucket_name: "elasticbeanstalk-us-east-1-126110431683"
  bucket_path: "frontend"
  on:
    branch: master
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY



name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t fniakan/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true fniakan/docker-react npm test